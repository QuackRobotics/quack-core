name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Reusable matrix jobs — conditionally run based on repo content
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          cargo install --locked cargo-fmt cargo-clippy 2>/dev/null || true
          pipx install ruff 2>/dev/null || pip install ruff
          npm install -g prettier markdownlint-cli 2>/dev/null || true
      - name: Run lint (per language present)
        run: |
          if [ -f Cargo.toml ]; then cargo fmt --all -- --check && cargo clippy --all-targets --all-features -- -D warnings; fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then ruff check .; fi
          if [ -f package.json ]; then npx prettier --check . && npx markdownlint "**/*.md"; fi
          if [ -f Dockerfile ]; then hadolint Dockerfile; fi
          if [ -f buf.yaml ]; then buf lint; fi
        shell: bash

  test-rust:
    name: Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ hashFiles('**/*.rs') != '' }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ hashFiles('**/*.rs') != '' }}
      - run: cargo test --all-targets --all-features
        if: ${{ hashFiles('**/*.rs') != '' }}

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') != '' }}
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -e .[test] 2>/dev/null || pip install pytest pytest-cov
        if: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') != '' }}
      - name: Install sim deps for sim/tests
        if: ${{ hashFiles('sim/requirements.txt') != '' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgl1
          pip install -r sim/requirements.txt
      - run: pytest --cov=./ --cov-report=xml
        if: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') != '' }}

  test-typescript:
    name: Test (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('**/package.json') != '' }}
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        if: ${{ hashFiles('**/package.json') != '' }}
      - run: npm test --if-present
        if: ${{ hashFiles('**/package.json') != '' }}

  # Sim gate: run the upstream walking policy in MuJoCo (sim/sim_gate.py).
  sim-gate:
    name: Sim Gate (MuJoCo walk test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # mujoco 3.2.* has no wheel for newer runner Pythons
      - name: Install MuJoCo + Python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgl1
          pip install -r sim/requirements.txt
      - name: Fetch pinned upstream assets (sha256-verified)
        run: bash sim/fetch_upstream.sh upstream
      - name: Sim gate - walk 10 s at 0.15 m/s without falling, >= 0.5 m forward
        run: python sim/sim_gate.py --upstream-dir upstream --cmd-x 0.15 --min-progress 0.5
      - name: Negative control - zero-action policy must FAIL the gate
        run: |
          set +e
          python sim/sim_gate.py --upstream-dir upstream --cmd-x 0.15 --min-progress 0.5 --sabotage zero-action
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "negative control expected exit 1 (gate failure), got $code"; exit 1
          fi
          echo "negative control OK: sabotaged policy was rejected"
  security:
    name: Security (audit + CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-audit
        if: ${{ hashFiles('**/Cargo.lock') != '' }}
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit
      - name: pip-audit
        if: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') != '' }}
        run: |
          pip install pip-audit
          pip-audit

  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

  # Final gate job — required by branch protection
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, test-rust, test-python, test-typescript, sim-gate, security, sbom]
    if: ${{ always() }}
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All CI gates passed"
