name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "CI works!"

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint]
    if: always()
    steps:
      - run: echo "All checks passed ✅"
