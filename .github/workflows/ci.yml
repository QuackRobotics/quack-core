name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    if: github.repository == 'QuackRobotics/quack-firmware' || github.repository == 'QuackRobotics/quack-api'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          target: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
        working-directory: ${{ github.repository == 'QuackRobotics/quack-firmware' && 'quack-firmware' || 'quack-api' }}
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: ${{ github.repository == 'QuackRobotics/quack-firmware' && 'quack-firmware' || 'quack-api' }}
      - run: cargo test --all --locked
        working-directory: ${{ github.repository == 'QuackRobotics/quack-firmware' && 'quack-firmware' || 'quack-api' }}
      - if: github.repository == 'QuackRobotics/quack-firmware'
        run: cargo build --release --target thumbv7em-none-eabihf
        working-directory: quack-firmware
      - if: github.repository == 'QuackRobotics/quack-firmware'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: quack-firmware/target/thumbv7em-none-eabihf/release/quack-firmware
          retention-days: 30

  python:
    name: Python (ruff, pytest, type-check)
    runs-on: ubuntu-latest
    if: github.repository == 'QuackRobotics/quack-ml' || github.repository == 'QuackRobotics/quack-sim' || github.repository == 'QuackRobotics/quack-hardware'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest pytest-cov mypy
      - run: ruff format --check .
        working-directory: ${{ github.repository == 'QuackRobotics/quack-ml' && 'quack-ml' || github.repository == 'QuackRobotics/quack-sim' && 'quack-sim' || 'quack-hardware' }}
      - run: ruff check .
        working-directory: ${{ github.repository == 'QuackRobotics/quack-ml' && 'quack-ml' || github.repository == 'QuackRobotics/quack-sim' && 'quack-sim' || 'quack-hardware' }}
      - run: mypy . --ignore-missing-imports || true
        working-directory: ${{ github.repository == 'QuackRobotics/quack-ml' && 'quack-ml' || github.repository == 'QuackRobotics/quack-sim' && 'quack-sim' || 'quack-hardware' }}
      - run: pytest --cov=. --cov-report=xml --cov-fail-under=60
        working-directory: ${{ github.repository == 'QuackRobotics/quack-ml' && 'quack-ml' || github.repository == 'QuackRobotics/quack-sim' && 'quack-sim' || 'quack-hardware' }}
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}

  typescript:
    name: TypeScript (prettier, eslint, test, build)
    runs-on: ubuntu-latest
    if: github.repository == 'QuackRobotics/quack-dashboard' || github.repository == 'QuackRobotics/quack-api'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        working-directory: ${{ github.repository == 'QuackRobotics/quack-dashboard' && 'quack-dashboard' || 'quack-api/sdk' }}
      - run: npx prettier --check .
        working-directory: ${{ github.repository == 'QuackRobotics/quack-dashboard' && 'quack-dashboard' || 'quack-api/sdk' }}
      - run: npx eslint .
        working-directory: ${{ github.repository == 'QuackRobotics/quack-dashboard' && 'quack-dashboard' || 'quack-api/sdk' }}
      - run: npx tsc --noEmit
        working-directory: ${{ github.repository == 'QuackRobotics/quack-dashboard' && 'quack-dashboard' || 'quack-api/sdk' }}
      - run: npm test -- --coverage
        working-directory: ${{ github.repository == 'QuackRobotics/quack-dashboard' && 'quack-dashboard' || 'quack-api/sdk' }}
      - run: npm run build
        working-directory: ${{ github.repository == 'QuackRobotics/quack-dashboard' && 'quack-dashboard' || 'quack-api/sdk' }}
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-build-${{ github.sha }}
          path: ${{ github.repository == 'QuackRobotics/quack-dashboard' && 'quack-dashboard/dist' || 'quack-api/sdk/dist' }}
          retention-days: 30

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://ghcr.io/igorshubovych/markdownlint-cli:latest
        with:
          args: '**/*.md'

  docker:
    name: Docker lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@master
        with:
          recursive: true
          failure-threshold: error

  protobuf:
    name: Protobuf (buf format, lint, breaking)
    runs-on: ubuntu-latest
    if: github.repository == 'QuackRobotics/quack-api'
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf format --check
        working-directory: quack-api
      - run: buf lint
        working-directory: quack-api
      - if: github.event_name == 'pull_request'
        run: buf breaking --against-input '.git#branch=main'
        working-directory: quack-api

  security:
    name: Security (cargo-audit, pip-audit)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - if: github.repository == 'QuackRobotics/quack-firmware' || github.repository == 'QuackRobotics/quack-api'
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - if: github.repository == 'QuackRobotics/quack-ml' || github.repository == 'QuackRobotics/quack-sim' || github.repository == 'QuackRobotics/quack-hardware'
        run: |
          pip install pip-audit
          pip-audit --desc --format=json --output=pip-audit.json || true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - if: github.repository == 'QuackRobotics/quack-firmware' || github.repository == 'QuackRobotics/quack-api'
        uses: actions-rs/cargo@v1
        with:
          command: install
          args: cargo-cyclonedx
      - if: github.repository == 'QuackRobotics/quack-firmware' || github.repository == 'QuackRobotics/quack-api'
        run: cargo cyclonedx --format json --output sbom-rust.json
        working-directory: ${{ github.repository == 'QuackRobotics/quack-firmware' && 'quack-firmware' || 'quack-api' }}
      - if: github.repository == 'QuackRobotics/quack-ml' || github.repository == 'QuackRobotics/quack-sim' || github.repository == 'QuackRobotics/quack-hardware'
        run: |
          pip install cyclonedx-bom
          cyclonedx-py -o sbom-python.json
        working-directory: ${{ github.repository == 'QuackRobotics/quack-ml' && 'quack-ml' || github.repository == 'QuackRobotics/quack-sim' && 'quack-sim' || 'quack-hardware' }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.repository }}-${{ github.sha }}
          path: sbom-*.json
          retention-days: 90

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [rust, python, typescript, markdown, docker, protobuf, security]
    if: always()
    steps:
      - run: |
          for job in rust python typescript markdown docker protobuf security; do
            result="${{ needs.$job.result }}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job $job failed with result: $result"
              exit 1
            fi
          done
          echo "All required checks passed ✅"
