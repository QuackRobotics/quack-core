name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    if: github.repository == 'QuackRobotics/quack-firmware' || github.repository == 'QuackRobotics/quack-api'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: echo "Rust job skipped for this repo"

  python:
    name: Python (ruff, pytest, type-check)
    runs-on: ubuntu-latest
    if: github.repository == 'QuackRobotics/quack-ml' || github.repository == 'QuackRobotics/quack-sim' || github.repository == 'QuackRobotics/quack-hardware'
    steps:
      - uses: actions/checkout@v4
      - run: echo "Python job skipped for this repo"

  typescript:
    name: TypeScript (prettier, eslint, test, build)
    runs-on: ubuntu-latest
    if: github.repository == 'QuackRobotics/quack-dashboard' || github.repository == 'QuackRobotics/quack-api'
    steps:
      - uses: actions/checkout@v4
      - run: echo "TypeScript job skipped for this repo"

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://ghcr.io/igorshubovych/markdownlint-cli:latest
        with:
          args: '**/*.md'

  docker:
    name: Docker lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@master
        with:
          recursive: true
          failure-threshold: error

  protobuf:
    name: Protobuf (buf format, lint, breaking)
    runs-on: ubuntu-latest
    if: github.repository == 'QuackRobotics/quack-api'
    steps:
      - uses: actions/checkout@v4
      - run: echo "Protobuf job skipped for this repo"

  security:
    name: Security (cargo-audit, pip-audit)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: echo "Security job skipped for this repo"

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: echo "SBOM job skipped for this repo"

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [rust, python, typescript, markdown, docker, protobuf, security, sbom]
    if: always()
    steps:
      - run: |
          for job in rust python typescript markdown docker protobuf security sbom; do
            result="${{ needs.$job.result }}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job $job failed with result: $result"
              exit 1
            fi
          done
          echo "All required checks passed ✅"
