name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Reusable matrix jobs — conditionally run based on repo content
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          cargo install --locked cargo-fmt cargo-clippy 2>/dev/null || true
          pipx install ruff 2>/dev/null || pip install ruff
          npm install -g prettier markdownlint-cli 2>/dev/null || true
      - name: Run lint (per language present)
        run: |
          [ -f Cargo.toml ] && cargo fmt --all -- --check && cargo clippy --all-targets --all-features -- -D warnings
          [ -f pyproject.toml ] || [ -f requirements.txt ] && ruff check .
          [ -f package.json ] && npx prettier --check . && npx markdownlint "**/*.md"
          [ -f Dockerfile ] && hadolint Dockerfile
          [ -f buf.yaml ] && buf lint
        shell: bash

  test-rust:
    name: Test (Rust)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('**/Cargo.toml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -e .[test] 2>/dev/null || pip install pytest pytest-cov
      - run: pytest --cov=./ --cov-report=xml

  test-typescript:
    name: Test (TypeScript)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('**/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test --if-present

  # Sim validation gate — runs in ALL repos to validate upstream policy+MJCF
  sim-gate:
    name: Sim Gate (MuJoCo walk test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install MuJoCo + Python deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender1 libxfixes3 libxi6
          pip install mujoco==3.2.* onnx onnxruntime numpy

      - name: Fetch upstream MJCF + ONNX policy (Open Duck Mini v2 @ b23317a)
        run: |
          mkdir -p upstream
          # MJCF model from Open Duck Mini v2 (Apache-2.0)
          curl -fsSL -o upstream/robot.xml \
            https://raw.githubusercontent.com/apirrone/Open_Duck_Mini/b23317a/mini_bdx/robots/open_duck_mini_v2/robot.xml
          # ONNX policy (best walk checkpoint v2) from same commit
          curl -fsSL -o upstream/BEST_WALK_ONNX_2.onnx \
            https://raw.githubusercontent.com/apirrone/Open_Duck_Mini/b23317a/BEST_WALK_ONNX_2.onnx

      - name: Verify SHA256 of fetched assets
        run: |
          echo "a134222e3b789f491b5a4a4781c6d19c91c86ad4d8481795b6b03f5eab6e0c7a  upstream/robot.xml" | sha256sum -c -
          echo "3c606f9381a1710cc8fecdb7442787dcbfce3ee9bc02a6f1224774ab2b3a1067  upstream/BEST_WALK_ONNX_2.onnx" | sha256sum -c -

      - name: Run sim gate — walk for 10s without falling
        run: |
          python - <<'PY'
          import mujoco
          import numpy as np
          import sys

          model = mujoco.MjModel.from_xml_path('upstream/robot.xml')
          data = mujoco.MjData(model)

          # Load ONNX policy
          import onnxruntime as ort
          session = ort.InferenceSession('upstream/BEST_WALK_ONNX_2.onnx')
          input_name = session.get_inputs()[0].name
          output_name = session.get_outputs()[0].name

          # Compute standing torso height from initial state (mj_forward on qpos0)
          mujoco.mj_forward(model, data)
          torso_id = model.body('torso').id if 'torso' in [model.body(i).name for i in range(model.nbody)] else 0
          standing_z = data.xpos[torso_id, 2]
          # Fall threshold = 50% of standing height (configurable)
          fall_threshold = standing_z * 0.5
          print(f"Standing torso_z = {standing_z:.3f} m, fall threshold = {fall_threshold:.3f} m")

          # Simulation parameters
          sim_duration = 10.0  # seconds
          dt = model.opt.timestep
          max_steps = int(sim_duration / dt)

          fallen = False
          for step in range(max_steps):
              # Get observation (simplified: qpos[2:] + qvel)
              obs = np.concatenate([data.qpos[2:], data.qvel]).astype(np.float32).reshape(1, -1)
              action = session.run([output_name], {input_name: obs})[0].flatten()
              data.ctrl[:] = action
              mujoco.mj_step(model, data)

              # Check fall condition
              torso_z = data.xpos[torso_id, 2]
              if torso_z < fall_threshold:
                  fallen = True
                  print(f"FELL at step {step} (t={step*dt:.2f}s), torso_z={torso_z:.3f} (threshold={fall_threshold:.3f})")
                  break

          if fallen:
              print("SIM GATE FAILED: Robot fell within 10s")
              sys.exit(1)
          else:
              print(f"SIM GATE PASSED: Walked {sim_duration}s without falling (final torso_z={torso_z:.3f})")

  security:
    name: Security (audit + CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-audit
        if: ${{ hashFiles('**/Cargo.toml') != '' }}
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit
      - name: pip-audit
        if: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') != '' }}
        run: |
          pip install pip-audit
          pip-audit

  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

  # Final gate job — required by branch protection
  ci:
    name: ci (gate)
    runs-on: ubuntu-latest
    needs: [lint, test-rust, test-python, test-typescript, sim-gate, security, sbom]
    if: ${{ always() }}
    steps:
      - name: Check all required jobs passed
        run: |
          for job in lint test-rust test-python test-typescript sim-gate security sbom; do
            result="${{ needs.$job.result }}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Required job $job failed: $result"
              exit 1
            fi
          done
      - run: echo "All CI gates passed!"