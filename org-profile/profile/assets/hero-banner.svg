<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Quack Robotics Micro Duck hero banner">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f4c5c"/>
      <stop offset="50%" style="stop-color:#1b6b7a"/>
      <stop offset="100%" style="stop-color:#2d8f9b"/>
    </linearGradient>
    <linearGradient id="beak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb347"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="url(#sky)" rx="12"/>
  <!-- subtle grid -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>
  <!-- duck-robot mascot -->
  <g transform="translate(120, 48)" filter="url(#shadow)">
    <!-- body -->
    <ellipse cx="140" cy="200" rx="95" ry="70" fill="#f5d547"/>
  </g>
  <g transform="translate(120, 48)">
    <!-- legs / servos -->
    <rect x="85" y="235" width="28" height="42" rx="6" fill="#3d4f5f"/>
    <rect x="165" y="235" width="28" height="42" rx="6" fill="#3d4f5f"/>
    <circle cx="99" cy="282" r="14" fill="#2a3540"/>
    <circle cx="179" cy="282" r="14" fill="#2a3540"/>
    <!-- torso panel -->
    <rect x="95" y="155" width="90" height="55" rx="8" fill="#e8c840" stroke="#c9a832" stroke-width="2"/>
    <circle cx="115" cy="178" r="4" fill="#5ce0d8"/>
    <circle cx="140" cy="178" r="4" fill="#5ce0d8"/>
    <circle cx="165" cy="178" r="4" fill="#5ce0d8"/>
    <!-- head -->
    <ellipse cx="140" cy="95" rx="75" ry="62" fill="#f5d547"/>
    <!-- eye -->
    <ellipse cx="165" cy="88" rx="18" ry="20" fill="#ffffff"/>
    <circle cx="172" cy="90" r="10" fill="#1a2e35"/>
    <circle cx="175" cy="87" r="3" fill="#ffffff"/>
    <!-- beak -->
    <path d="M 200 95 L 255 88 L 200 115 Z" fill="url(#beak)"/>
    <!-- antenna -->
    <line x1="140" y1="35" x2="140" y2="52" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="140" cy="28" r="8" fill="#5ce0d8" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- wordmark -->
  <text x="420" y="118" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="52" font-weight="700">Quack Robotics</text>
  <text x="420" y="168" fill="#b8f0ec" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="500">Micro Duck</text>
  <text x="420" y="220" fill="#d4e8ec" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="400">~42 cm open-source biped</text>
  <!-- decorative circuit traces -->
  <g stroke="#5ce0d8" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 900 80 H 1050 V 120 H 1120"/>
    <path d="M 920 200 H 1080 V 160 H 1140"/>
    <circle cx="900" cy="80" r="5" fill="#5ce0d8"/>
    <circle cx="1120" cy="120" r="5" fill="#5ce0d8"/>
    <circle cx="920" cy="200" r="5" fill="#5ce0d8"/>
    <circle cx="1140" cy="160" r="5" fill="#5ce0d8"/>
  </g>
</svg>